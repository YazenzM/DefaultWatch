[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defaultwatch"
version = "0.1.0"
description = "Mortgage default model with reason codes and monitoring, built on the Freddie Mac Single-Family Loan-Level Dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "lightgbm>=4.3",
  "joblib>=1.3",
  "pyyaml>=6",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.5"]
track = ["mlflow>=2.16"]
viz = ["matplotlib>=3.8"]
dashboard = ["streamlit>=1.46", "plotly>=5.20"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.5", "matplotlib>=3.8", "streamlit>=1.46", "plotly>=5.20"]

[project.scripts]
defaultwatch = "defaultwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
